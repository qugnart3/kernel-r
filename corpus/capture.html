<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kernel-R Fingerprint Capture</title>
<style>
body { font-family: monospace; background: #111; color: #0f0; padding: 20px; }
pre { white-space: pre-wrap; word-break: break-all; }
button { font-size: 18px; padding: 10px 30px; margin: 10px 0; cursor: pointer; }
canvas { display: none; }
#status { color: #ff0; font-size: 14px; }
</style>
</head>
<body>
<h1>Kernel-R Fingerprint Capture (M1-M12)</h1>
<p id="status">Click to capture all fingerprint data from this machine.</p>
<button onclick="captureAll()">CAPTURE ALL</button>
<pre id="output"></pre>
<canvas id="c2d" width="400" height="200"></canvas>
<canvas id="cgl" width="1" height="1"></canvas>

<script>
async function captureAll() {
  document.getElementById('status').textContent = 'Capturing...';
  const result = {};

  // M1: GPU / WebGL params
  try {
    const c = document.getElementById('cgl');
    const gl = c.getContext('webgl2') || c.getContext('webgl');
    if (gl) {
      const dbg = gl.getExtension('WEBGL_debug_renderer_info');
      result.gpu = {
        vendor: dbg ? gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) : null,
        renderer: dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : null,
        MAX_TEXTURE_SIZE: gl.getParameter(gl.MAX_TEXTURE_SIZE),
        MAX_CUBE_MAP_TEXTURE_SIZE: gl.getParameter(gl.MAX_CUBE_MAP_TEXTURE_SIZE),
        MAX_TEXTURE_IMAGE_UNITS: gl.getParameter(gl.MAX_TEXTURE_IMAGE_UNITS),
        MAX_VERTEX_ATTRIBS: gl.getParameter(gl.MAX_VERTEX_ATTRIBS),
        MAX_VERTEX_UNIFORM_VECTORS: gl.getParameter(gl.MAX_VERTEX_UNIFORM_VECTORS),
        MAX_FRAGMENT_UNIFORM_VECTORS: gl.getParameter(gl.MAX_FRAGMENT_UNIFORM_VECTORS),
        MAX_RENDERBUFFER_SIZE: gl.getParameter(gl.MAX_RENDERBUFFER_SIZE),
        MAX_VARYING_VECTORS: gl.getParameter(gl.MAX_VARYING_VECTORS),
        MAX_VERTEX_TEXTURE_IMAGE_UNITS: gl.getParameter(gl.MAX_VERTEX_TEXTURE_IMAGE_UNITS),
        STENCIL_BITS: gl.getParameter(gl.STENCIL_BITS),
        MAX_SAMPLES: gl.getParameter(gl.MAX_SAMPLES),
        ALIASED_LINE_WIDTH_RANGE: Array.from(gl.getParameter(gl.ALIASED_LINE_WIDTH_RANGE)),
        ALIASED_POINT_SIZE_RANGE: Array.from(gl.getParameter(gl.ALIASED_POINT_SIZE_RANGE)),
        MAX_3D_TEXTURE_SIZE: gl.getParameter(0x8073),
        MAX_ARRAY_TEXTURE_LAYERS: gl.getParameter(0x88FF),
        MAX_DRAW_BUFFERS: gl.getParameter(0x8824),
        MAX_UNIFORM_BUFFER_BINDINGS: gl.getParameter(0x8A2F),
        MAX_COMBINED_TEXTURE_IMAGE_UNITS: gl.getParameter(gl.MAX_COMBINED_TEXTURE_IMAGE_UNITS),
        MAX_COLOR_ATTACHMENTS: gl.getParameter(0x8CDF),
        UNIFORM_BUFFER_OFFSET_ALIGNMENT: gl.getParameter(0x8A34),
        MAX_TEXTURE_LOD_BIAS: gl.getParameter(0x84FD),
        MAX_VIEWPORT_DIMS: Array.from(gl.getParameter(gl.MAX_VIEWPORT_DIMS)),
        extensions: gl.getSupportedExtensions(),
      };

      // Shader precision
      const hp = gl.getShaderPrecisionFormat(gl.FRAGMENT_SHADER, gl.HIGH_FLOAT);
      const vp = gl.getShaderPrecisionFormat(gl.VERTEX_SHADER, gl.HIGH_FLOAT);
      result.gpu.precision = {
        frag_high: { min: hp.rangeMin, max: hp.rangeMax, prec: hp.precision },
        vert_high: { min: vp.rangeMin, max: vp.rangeMax, prec: vp.precision },
      };
    }
  } catch(e) { result.gpu_error = e.message; }

  // M2: Canvas path (15 floats)
  try {
    const c = document.getElementById('c2d');
    const ctx = c.getContext('2d');
    ctx.clearRect(0, 0, 400, 200);
    ctx.beginPath();
    ctx.arc(50, 50, 40, 0, Math.PI * 2);
    ctx.bezierCurveTo(100, 10, 150, 60, 200, 50);
    ctx.quadraticCurveTo(250, 120, 300, 80);
    ctx.stroke();
    const img = ctx.getImageData(0, 0, 400, 200);
    // Sample 15 specific pixel positions for path fingerprint
    const positions = [10,50, 50,50, 90,50, 100,30, 150,60, 200,50, 250,120, 300,80,
                       25,25, 75,75, 120,45, 180,55, 220,90, 280,70, 350,100];
    const pathValues = [];
    for (let i = 0; i < positions.length; i += 2) {
      const idx = (positions[i+1] * 400 + positions[i]) * 4;
      pathValues.push(img.data[idx], img.data[idx+1], img.data[idx+2], img.data[idx+3]);
    }
    result.canvas_path = pathValues;
  } catch(e) { result.canvas_path_error = e.message; }

  // M3: Canvas toDataURL hash
  try {
    const c = document.getElementById('c2d');
    const ctx = c.getContext('2d');
    ctx.clearRect(0, 0, 400, 200);
    ctx.fillStyle = '#f00';
    ctx.fillRect(10, 10, 100, 80);
    ctx.fillStyle = '#0f0';
    ctx.font = '30px Arial';
    ctx.fillText('Kernel-R fp', 120, 60);
    ctx.beginPath();
    ctx.arc(300, 100, 50, 0, Math.PI * 2);
    ctx.fillStyle = '#00f';
    ctx.fill();
    result.canvas_hash = c.toDataURL();
  } catch(e) { result.canvas_hash_error = e.message; }

  // M4: Audio hash
  try {
    const actx = new OfflineAudioContext(1, 44100, 44100);
    const osc = actx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.value = 10000;
    const comp = actx.createDynamicsCompressor();
    comp.threshold.value = -50;
    comp.knee.value = 40;
    comp.ratio.value = 12;
    comp.attack.value = 0;
    comp.release.value = 0.25;
    osc.connect(comp);
    comp.connect(actx.destination);
    osc.start(0);
    const buf = await actx.startRendering();
    const data = buf.getChannelData(0);
    // Hash: sum of first 500 samples
    let sum = 0;
    for (let i = 0; i < 500; i++) sum += Math.abs(data[i]);
    result.audio = { hash_sum: sum, samples: Array.from(data.slice(0, 20)) };
  } catch(e) { result.audio_error = e.message; }

  // M5: Font metrics
  try {
    const testFonts = ['Arial', 'Calibri', 'Cambria', 'Consolas', 'Courier New',
                       'Georgia', 'Impact', 'Segoe UI', 'Tahoma', 'Times New Roman',
                       'Trebuchet MS', 'Verdana', 'Comic Sans MS', 'Palatino Linotype',
                       'Garamond', 'Bookman Old Style', 'Century Gothic'];
    const span = document.createElement('span');
    span.style.position = 'absolute';
    span.style.left = '-9999px';
    span.style.fontSize = '72px';
    span.textContent = 'mmmmmmmmmmlli';
    document.body.appendChild(span);
    const metrics = {};
    for (const f of testFonts) {
      span.style.fontFamily = `"${f}", monospace`;
      metrics[f] = { w: span.offsetWidth, h: span.offsetHeight };
    }
    document.body.removeChild(span);
    result.font_metrics = metrics;
  } catch(e) { result.font_metrics_error = e.message; }

  // M6: jsHeapSizeLimit
  try {
    result.memory = {
      jsHeapSizeLimit: performance.memory ? performance.memory.jsHeapSizeLimit : null,
      totalJSHeapSize: performance.memory ? performance.memory.totalJSHeapSize : null,
    };
  } catch(e) { result.memory_error = e.message; }

  // M7: StorageManager quota
  try {
    if (navigator.storage && navigator.storage.estimate) {
      const est = await navigator.storage.estimate();
      result.storage = { quota: est.quota, usage: est.usage };
    }
  } catch(e) { result.storage_error = e.message; }

  // M8: UA-CH brands
  try {
    result.uach = {
      brands: navigator.userAgentData ? navigator.userAgentData.brands : null,
      mobile: navigator.userAgentData ? navigator.userAgentData.mobile : null,
      platform: navigator.userAgentData ? navigator.userAgentData.platform : null,
    };
    if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
      const he = await navigator.userAgentData.getHighEntropyValues([
        'platformVersion', 'architecture', 'bitness', 'fullVersionList', 'model', 'wow64'
      ]);
      result.uach_high = he;
    }
  } catch(e) { result.uach_error = e.message; }

  // M9: platformVersion (included in M8 above)

  // M10: SpeechSynthesis voices
  try {
    const getVoices = () => new Promise(resolve => {
      const voices = speechSynthesis.getVoices();
      if (voices.length) return resolve(voices);
      speechSynthesis.onvoiceschanged = () => resolve(speechSynthesis.getVoices());
      setTimeout(() => resolve(speechSynthesis.getVoices()), 2000);
    });
    const voices = await getVoices();
    result.voices = voices.map(v => ({
      default: v.default, lang: v.lang, localService: v.localService,
      name: v.name, voiceURI: v.voiceURI
    }));
  } catch(e) { result.voices_error = e.message; }

  // M11: Plugins + mimeTypes
  try {
    result.plugins = {
      count: navigator.plugins.length,
      list: Array.from(navigator.plugins).map(p => p.name),
      mimeTypes_count: navigator.mimeTypes.length,
    };
  } catch(e) { result.plugins_error = e.message; }

  // M12: Window chrome height
  result.window = {
    outerWidth: window.outerWidth,
    outerHeight: window.outerHeight,
    innerWidth: window.innerWidth,
    innerHeight: window.innerHeight,
    screenX: window.screenX,
    screenY: window.screenY,
    chrome_height: window.outerHeight - window.innerHeight,
    screen: {
      width: screen.width, height: screen.height,
      availWidth: screen.availWidth, availHeight: screen.availHeight,
      colorDepth: screen.colorDepth, pixelDepth: screen.pixelDepth,
    },
    dpr: window.devicePixelRatio,
  };

  // Extra: Navigator
  result.navigator = {
    userAgent: navigator.userAgent,
    platform: navigator.platform,
    hardwareConcurrency: navigator.hardwareConcurrency,
    deviceMemory: navigator.deviceMemory,
    language: navigator.language,
    languages: Array.from(navigator.languages),
    maxTouchPoints: navigator.maxTouchPoints,
    webdriver: navigator.webdriver,
    cookieEnabled: navigator.cookieEnabled,
    pdfViewerEnabled: navigator.pdfViewerEnabled,
    doNotTrack: navigator.doNotTrack,
  };

  // Extra: Connection
  try {
    if (navigator.connection) {
      result.connection = {
        effectiveType: navigator.connection.effectiveType,
        downlink: navigator.connection.downlink,
        rtt: navigator.connection.rtt,
        saveData: navigator.connection.saveData,
      };
    }
  } catch(e) {}

  // Extra: Permissions
  try {
    const notif = await navigator.permissions.query({name: 'notifications'});
    result.permissions = { notifications: notif.state };
  } catch(e) {}

  // Output
  const json = JSON.stringify(result, null, 2);
  document.getElementById('output').textContent = json;
  document.getElementById('status').textContent =
    'Done! Copy JSON below or save via button.';

  // Download button
  const btn = document.createElement('button');
  btn.textContent = 'SAVE JSON';
  btn.onclick = () => {
    const blob = new Blob([json], {type: 'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'capture_' + Date.now() + '.json';
    a.click();
  };
  document.getElementById('status').after(btn);
}
</script>
</body>
</html>
